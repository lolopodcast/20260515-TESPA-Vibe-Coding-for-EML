/* ============ Analytics Panel ============ */
const AnalyticsPanel = ({ t, lang, modulesList, setModule, analytics, setAnalytics, studentInfo, setStudentInfo, LS_KEY, LS_STU }) => {
  const totalTime = analytics.time.reduce((a,b)=>a+b,0);
  const totalClicks = analytics.clicks.reduce((a,b)=>a+b,0);
  const totalCorrect = analytics.quizCorrect.reduce((a,b)=>a+b,0);
  const totalAnswered = analytics.quizTotal.reduce((a,b)=>a+b,0);
  const overallAcc = totalAnswered > 0 ? Math.round(totalCorrect/totalAnswered*100) : 0;
  const totalCardsRead = analytics.cardsRead.reduce((a,b)=>a+b,0);
  const totalCardsAll = analytics.cardsTotal.reduce((a,b)=>a+b,0);
  const cardUsage = totalCardsAll > 0 ? Math.round(totalCardsRead/totalCardsAll*100) : 0;

  // 弱點
  const weakPoints = [];
  for (let i=1; i<=NUM_LEARN; i++) {
    if (analytics.quizTotal[i] > 0) {
      const acc = Math.round(analytics.quizCorrect[i]/analytics.quizTotal[i]*100);
      if (acc < 75) {
        weakPoints.push({
          mid: i, name: modulesList[i].title.replace(/^\d+\.\s*/,''),
          acc, wrongs: analytics.wrongTopics[i] || []
        });
      }
    }
  }
  weakPoints.sort((a,b)=>a.acc-b.acc);

  const formComplete = studentInfo.group && studentInfo.dept && studentInfo.id && studentInfo.nameEn && studentInfo.nameZh;

  // CSV 匯出 — 檔名永遠中文
  const exportCSV = () => {
    if (!formComplete) return;
    const zh = dict.zh;
    const now = new Date();
    const date = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    const filename = `${zh.brand} ${zh.title}_${studentInfo.nameEn} ${studentInfo.nameZh}_${date}.csv`;
    const rows = [
      ['Group', studentInfo.group],
      ['Dept/Year', studentInfo.dept],
      ['Student ID', studentInfo.id],
      ['Name (EN)', studentInfo.nameEn],
      ['Name (ZH)', studentInfo.nameZh],
      ['Export Date', now.toISOString()],
      [],
      ['Module','Title','Time (s)','Clicks','Correct','Answered','Total Q','Cards Read','Cards Total','Wrong Questions']
    ];
    for (let i=0; i<TOTAL; i++) {
      const name = modulesList[i].title.replace(/^\d+\.\s*/,'');
      const totalQ = (i>=1 && i<=NUM_LEARN && dict.zh[`m${i}_q`]) ? dict.zh[`m${i}_q`].length : 0;
      const wrongs = (analytics.wrongTopics[i] || []).join(' | ');
      rows.push([
        `M${i}`, name,
        analytics.time[i]||0, analytics.clicks[i]||0,
        analytics.quizCorrect[i]||0, analytics.quizTotal[i]||0, totalQ,
        analytics.cardsRead[i]||0, analytics.cardsTotal[i]||0,
        wrongs
      ]);
    }
    const csv = '\uFEFF' + rows.map(r => r.map(c => {
      const s = String(c==null?'':c);
      return /[,"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
    }).join(',')).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  };

  const clearLog = () => {
    if (window.confirm(t.analytics_wp_clear_confirm)) {
      const fresh = {
        time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
        quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
        cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0),
        wrongTopics: {}
      };
      setAnalytics(fresh);
      try { localStorage.setItem(LS_KEY, JSON.stringify(fresh)); } catch {}
    }
  };

  return (
    <div className="space-y-6 animate-fade-in">
      <H2 icon="📊" number={IDX_ANA}>{t.analytics_title}</H2>
      <p className="text-slate-600 dark:text-slate-300">{t.analytics_desc}</p>

      {/* 4 統計卡 */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatCard label={t.analytics_total_time} val={`${totalTime}${t.analytics_sec}`} icon="⏱️"/>
        <StatCard label={t.analytics_total_clicks} val={`${totalClicks}`} icon="👆"/>
        <StatCard label={t.analytics_overall_acc} val={`${overallAcc}%`} icon="🎯"/>
        <StatCard label={t.analytics_card_usage} val={`${cardUsage}%`} icon="🃏"/>
      </div>

      {/* 整體學習進度 */}
      <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-4">{t.analytics_progress_title}</h3>
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2">
          {modulesList.map(m => {
            const visited = (analytics.time[m.id]||0) > 0 || (analytics.clicks[m.id]||0) > 0;
            const quizDone = (analytics.quizTotal[m.id]||0) > 0;
            const status = quizDone ? 'quiz' : (visited ? 'visited' : 'not');
            const colors = { quiz: 'bg-green-500 text-white', visited: 'bg-amber-400 text-amber-900', not: 'bg-slate-200 dark:bg-slate-700 text-slate-500' };
            return (
              <button key={m.id} onClick={() => setModule(m.id)}
                className={`px-2 py-2 rounded-lg text-xs font-bold ${colors[status]} hover:opacity-80 transition-all text-left`}>
                <div className="font-mono">M{m.num} {m.icon}</div>
                <div className="truncate text-[10px] mt-1">{m.title.replace(/^\d+\.\s*/,'')}</div>
              </button>
            );
          })}
        </div>
        <div className="flex gap-4 text-xs mt-3 text-slate-500">
          <span>🟢 {t.analytics_progress_quiz_done}</span>
          <span>🟡 {t.analytics_progress_visited}</span>
          <span>⚪ {t.analytics_progress_not_visited}</span>
        </div>
      </div>

      {/* 弱點分析 */}
      <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-4">{t.analytics_wp_title}</h3>
        {weakPoints.length > 0 ? (
          <div className="space-y-3">
            {weakPoints.map((wp,i) => (
              <div key={i} className="border-l-4 border-red-400 bg-red-50 dark:bg-red-900/20 p-3 rounded-r-lg">
                <div className="flex justify-between items-center mb-2">
                  <span className="font-bold text-sm">{wp.name}</span>
                  <span className="font-mono text-sm font-bold text-red-600 dark:text-red-400">{wp.acc}%</span>
                </div>
                {wp.wrongs.length > 0 && (
                  <div className="text-xs text-slate-600 dark:text-slate-400 mb-2">
                    <div className="font-bold mb-1">{t.analytics_wp_incorrect}</div>
                    <ul className="list-disc list-inside space-y-1">
                      {wp.wrongs.map((w,j) => <li key={j}>{w}</li>)}
                    </ul>
                  </div>
                )}
                <button onClick={() => setModule(wp.mid)} className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] hover:underline">
                  {t.analytics_wp_goto}
                </button>
              </div>
            ))}
          </div>
        ) : (
          <p className="text-sm text-green-700 dark:text-green-400 font-medium">✅ {totalAnswered > 0 ? t.analytics_wp_allpass : (lang==='zh'?'尚未開始測驗':'No quiz attempts yet')}</p>
        )}
      </div>

      {/* 各模組明細 */}
      <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 overflow-x-auto">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-4">{lang==='zh'?'各模組明細':'Per-Module Detail'}</h3>
        <table className="w-full text-xs sm:text-sm">
          <thead>
            <tr className="border-b border-slate-200 dark:border-slate-700 text-left">
              <th className="py-2 pr-2">{t.analytics_module}</th>
              <th className="py-2 pr-2">{t.analytics_time}</th>
              <th className="py-2 pr-2">{t.analytics_clicks}</th>
              <th className="py-2 pr-2">{t.analytics_acc}</th>
              <th className="py-2 pr-2 hidden sm:table-cell">{t.analytics_correct_ans_total}</th>
              <th className="py-2">{t.analytics_cards_read_total}</th>
            </tr>
          </thead>
          <tbody>
            {modulesList.map(m => {
              const time = analytics.time[m.id]||0;
              const clicks = analytics.clicks[m.id]||0;
              const c = analytics.quizCorrect[m.id]||0;
              const total = analytics.quizTotal[m.id]||0;
              const totalQ = (m.id>=1 && m.id<=NUM_LEARN && dict.zh[`m${m.id}_q`]) ? dict.zh[`m${m.id}_q`].length : 0;
              const acc = total > 0 ? Math.round(c/total*100) : null;
              const cr = analytics.cardsRead[m.id]||0;
              const ct = analytics.cardsTotal[m.id]||0;
              return (
                <tr key={m.id} className="border-b border-slate-100 dark:border-slate-700/50">
                  <td className="py-2 pr-2 font-medium">M{m.num} {m.icon} <span className="hidden sm:inline">{m.title.replace(/^\d+\.\s*/,'')}</span></td>
                  <td className="py-2 pr-2">{time}{t.analytics_sec}</td>
                  <td className="py-2 pr-2">{clicks}</td>
                  <td className="py-2 pr-2">{acc !== null ? <span className={acc>=75?'text-green-600 dark:text-green-400 font-bold':'text-red-500 font-bold'}>{acc}%</span> : <span className="text-slate-400">—</span>}</td>
                  <td className="py-2 pr-2 hidden sm:table-cell">{total>0?`${c} / ${total} / ${totalQ}`:'—'}</td>
                  <td className="py-2">{ct>0?`${cr} / ${ct}`:'—'}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* 學習者基本資料 */}
      <div className="bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-4">{t.analytics_form_title}</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label className="block text-xs text-slate-500 mb-1">{t.analytics_group}</label>
            <select value={studentInfo.group} onChange={e=>setStudentInfo({...studentInfo, group:e.target.value})}
              className="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700">
              <option value="">{t.analytics_group_select}</option>
              {t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-xs text-slate-500 mb-1">{t.analytics_dept}</label>
            <input type="text" value={studentInfo.dept} onChange={e=>setStudentInfo({...studentInfo, dept:sanitizeName(e.target.value)})}
              placeholder={t.analytics_dept_ph}
              className="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700"/>
          </div>
          <div>
            <label className="block text-xs text-slate-500 mb-1">{t.analytics_id}</label>
            <input type="text" value={studentInfo.id} onChange={e=>setStudentInfo({...studentInfo, id:sanitizeStudentId(e.target.value)})}
              placeholder={t.analytics_id_ph}
              className="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700"/>
          </div>
          <div>
            <label className="block text-xs text-slate-500 mb-1">{t.analytics_name_en}</label>
            <input type="text" value={studentInfo.nameEn} onChange={e=>setStudentInfo({...studentInfo, nameEn:sanitizeName(e.target.value)})}
              placeholder={t.analytics_name_en_ph}
              className="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700"/>
          </div>
          <div>
            <label className="block text-xs text-slate-500 mb-1">{t.analytics_name_zh}</label>
            <input type="text" value={studentInfo.nameZh} onChange={e=>setStudentInfo({...studentInfo, nameZh:sanitizeName(e.target.value)})}
              placeholder={t.analytics_name_zh_ph}
              className="w-full px-3 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700"/>
          </div>
        </div>

        <div className="flex flex-wrap gap-3 mt-5">
          <button onClick={exportCSV} disabled={!formComplete}
            className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg text-sm disabled:opacity-40 disabled:cursor-not-allowed">
            📥 {t.analytics_export_csv}
          </button>
          <button onClick={clearLog} className="px-5 py-2 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg text-sm">
            {t.analytics_wp_clear}
          </button>
        </div>
        {!formComplete && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">⚠️ {t.analytics_fill_required}</p>}
        <p className="text-xs text-slate-500 dark:text-slate-400 mt-3 italic">{t.analytics_wp_saved}</p>
      </div>
    </div>
  );
};

const StatCard = ({ label, val, icon }) => (
  <div className="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700">
    <div className="text-2xl mb-1">{icon}</div>
    <div className="text-2xl font-serif font-black text-[#004030] dark:text-[#D8C3A5]">{val}</div>
    <div className="text-xs text-slate-500 mt-1">{label}</div>
  </div>
);

/* ============ Mount ============ */
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
